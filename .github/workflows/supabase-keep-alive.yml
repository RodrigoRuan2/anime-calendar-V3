name: Keep Supabase active

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase health endpoint
        env:
          SUPABASE_KEEP_ALIVE_URL: ${{ secrets.SUPABASE_KEEP_ALIVE_URL }}
        run: |
          test -n "$SUPABASE_KEEP_ALIVE_URL"
          curl --fail --silent --show-error --max-time 15 "${SUPABASE_KEEP_ALIVE_URL}?health=1"
