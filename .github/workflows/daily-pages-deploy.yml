name: Deploy diário do AniCal

on:
  schedule:
    # 12:00 em São Paulo (BRT, UTC-3) = 15:00 UTC.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar e gerar site
        env:
          # A chave publishable é própria para o navegador; as tabelas continuam
          # protegidas por RLS e não há nenhuma chave administrativa neste fluxo.
          VITE_SUPABASE_FUNCTION_URL: https://rlppmkygztpdcytoeprl.supabase.co/functions/v1/anime-schedule-proxy
          VITE_SUPABASE_URL: https://rlppmkygztpdcytoeprl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3M2r0YsWYqwmFnY3iIXbcA_PqmIAdU_
        run: |
          npm test
          npm run build

      - name: Publicar no GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run deploy
