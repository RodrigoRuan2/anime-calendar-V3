name: Deploy diário do AniCal

on:
  schedule:
    # 23:10 em São Paulo (BRT, UTC-3) = 02:10 UTC do dia seguinte.
    - cron: '10 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar configuração de produção
        env:
          VITE_SUPABASE_FUNCTION_URL: ${{ secrets.VITE_SUPABASE_FUNCTION_URL }}
        run: |
          test -n "$VITE_SUPABASE_FUNCTION_URL"

      - name: Testar e gerar site
        env:
          VITE_SUPABASE_FUNCTION_URL: ${{ secrets.VITE_SUPABASE_FUNCTION_URL }}
        run: |
          npm test
          npm run build

      - name: Publicar no GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_SUPABASE_FUNCTION_URL: ${{ secrets.VITE_SUPABASE_FUNCTION_URL }}
        run: npm run deploy
