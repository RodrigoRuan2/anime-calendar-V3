name: Deploy diário do AniCal

on:
  schedule:
    # 12:00 em São Paulo (BRT, UTC-3) = 15:00 UTC.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar e gerar site
        run: |
          npm test
          npm run build

      - name: Publicar no GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run deploy
